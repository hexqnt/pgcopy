[package]
name = "pgcopy"
version = "0.1.9"
edition = "2024"
description = "CLI tool to export selected PostgreSQL objects into a bundle and import them into another database."
authors = ["hexqnt <hexqntlab@gmail.com>"]
license = "MIT OR Apache-2.0"
keywords = ["postgresql", "migration", "backup", "cli", "copy"]
categories = ["command-line-utilities", "database"]
publish = false

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
] }
tokio-postgres = "0.7.18"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
zstd = "0.14.3"

[lints]
workspace = true

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Эти lint-ы дают шум для бинарного crate и стороннего dependency graph.
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
future_not_send = "allow"
too_many_lines = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
struct_field_names = "allow"
