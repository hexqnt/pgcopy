[package]
name = "pgcopy"
version = "0.1.6"
edition = "2024"
description = "CLI tool to export selected PostgreSQL objects into a bundle and import them into another database."
authors = ["hexqnt <hexqntlab@gmail.com>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["postgresql", "migration", "backup", "cli", "copy"]
categories = ["command-line-utilities", "database"]
publish = false

[dependencies]
age = "0.11.3"
anyhow = "1.0.100"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.31"
indicatif = "0.18.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
] }
tokio-postgres = "0.7.17"
toml = "1.1.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
zstd = "0.13.3"

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
# rustflags = ["-Ctarget-cpu=x86-64-v3", "-Ctarget-feature=+avx2,+fma"]

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
