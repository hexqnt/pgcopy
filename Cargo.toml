[package]
name = "pgcopy"
version = "0.1.1"
edition = "2024"
description = "CLI tool to export selected PostgreSQL objects into a bundle and import them into another database."
authors = ["hexqnt <kvover@gmail.org>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["postgresql", "migration", "backup", "cli", "copy"]
categories = ["command-line-utilities", "database"]
publish = false

[dependencies]
age = "0.11.1"
anyhow = "1.0.100"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
futures-util = "0.3.31"
indicatif = "0.18.3"
once_cell = "1.21.3"
regex = "1.11.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tar = "0.4.44"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
] }
tokio-postgres = "0.7.15"
toml = "0.9.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
zstd = "0.13.3"

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
# rustflags = ["-Ctarget-cpu=x86-64-v3", "-Ctarget-feature=+avx2,+fma"]

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
